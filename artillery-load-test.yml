config:
  target: "http://localhost:8000"
  phases:
    - duration: 60
      arrivalRate: 10
      rampTo: 100
      name: "Warm-up phase"
    - duration: 180
      arrivalRate: 100
      name: "Sustained load"
scenarios:
  - name: "Health & Alert API Stress Test"
    flow:
      - get:
          url: "/health"
      - get:
          url: "/api/v1/events/stats/summary"
