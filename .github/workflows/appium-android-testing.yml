name: MedSIEM Appium Android Testing

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  appium-android-e2e:
    name: Build APK & Run Appium Android E2E Suite
    runs-on: macos-13
    timeout-minutes: 45

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # ------------------------------------------------------------------------
      # 1. SETUP BUILD PREREQUISITES
      # ------------------------------------------------------------------------
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare Test Results Directory
        run: |
          mkdir -p test-results/appium/screenshots

      # ------------------------------------------------------------------------
      # 2. BUILD NATIVE ANDROID DEBUG APK
      # ------------------------------------------------------------------------
      - name: Install Android JavaScript Dependencies
        run: |
          cd android
          npm install

      - name: Build Android Debug APK
        run: |
          cd android/android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon
          APK_FILE="app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$APK_FILE" ]; then
            echo "Successfully built APK at $APK_FILE"
            ls -lh "$APK_FILE"
          else
            echo "APK build failed, file not found!"
            exit 1
          fi

      # ------------------------------------------------------------------------
      # 3. INSTALL APPIUM & DRIVERS
      # ------------------------------------------------------------------------
      - name: Install Appium & UiAutomator2 Driver
        run: |
          npm install -g appium@2.11.2
          appium driver install uiautomator2

      - name: Install Mobile Test Suite Dependencies
        run: |
          cd tests/mobile
          npm install

      # ------------------------------------------------------------------------
      # 4. LAUNCH ANDROID EMULATOR & EXECUTE APPIUM SUITE
      # ------------------------------------------------------------------------
      - name: Run Appium Tests in Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb devices
            echo "Starting Appium server on 127.0.0.1:4723..."
            appium --log test-results/appium/appium.log --address 127.0.0.1 --port 4723 &
            APPIUM_PID=$!
            sleep 6

            echo "Executing MedSIEM Appium Android Test Runner..."
            APP_PATH="$(pwd)/android/android/app/build/outputs/apk/debug/app-debug.apk" \
            node tests/mobile/run_appium.js 2>&1 | tee test-results/appium/execution.log || true

            kill $APPIUM_PID 2>/dev/null || true

      # ------------------------------------------------------------------------
      # 5. PUBLISH APPIUM TEST ARTIFACTS
      # ------------------------------------------------------------------------
      - name: Publish Appium Android Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: medsiem-appium-test-results
          path: |
            test-results/appium/
          retention-days: 14

      - name: Append Appium Summary to Job Summary
        if: always()
        run: |
          if [ -f test-results/appium/summary.md ]; then
            cat test-results/appium/summary.md >> $GITHUB_STEP_SUMMARY
          else
            echo "### Appium Android Automation Execution" >> $GITHUB_STEP_SUMMARY
            echo "Execution logs and results available in artifacts: medsiem-appium-test-results" >> $GITHUB_STEP_SUMMARY
          fi
