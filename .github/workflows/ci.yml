name: Comprehensive MedSIEM CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-unit-and-security:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: medsiem_db
          POSTGRES_USER: medsiem_user
          POSTGRES_PASSWORD: medsiem_secure_password_2026
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest-cov

      - name: Run Bandit Security Scan
        run: |
          bandit -r backend/app -x backend/tests

      - name: Run Pytest Suite with Coverage Target (95%)
        env:
          POSTGRES_SERVER: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: medsiem_user
          POSTGRES_PASSWORD: medsiem_secure_password_2026
          POSTGRES_DB: medsiem_db
          SECRET_KEY: test_secret_key_ci_cd_medsiem_min32chars
        run: |
          cd backend
          pytest tests/unit tests/integration --cov=app --cov-report=xml --cov-fail-under=95

      - name: Upload Coverage XML
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: backend/coverage.xml

  frontend-build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install & Build
        run: |
          cd frontend
          npm ci
          npm run build
