name: MedSIEM Selenium Web Testing

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selenium-web-e2e:
    name: Selenium Headless Chrome Web Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: medsiem_db
          POSTGRES_USER: medsiem_user
          POSTGRES_PASSWORD: medsiem_secure_password_2026
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      # ── ACTION 1: actions/checkout@v4 ──────────────────────────────────────
      - name: "Action: Checkout Repository Code"
        uses: actions/checkout@v4

      # ── ACTION 2: actions/setup-python@v5 ──────────────────────────────────
      - name: "Action: Setup Python 3.12"
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl
          pip install -r backend/requirements.txt

      - name: Run Database Migrations & Seed Super Admin
        env:
          POSTGRES_SERVER: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: medsiem_user
          POSTGRES_PASSWORD: medsiem_secure_password_2026
          POSTGRES_DB: medsiem_db
          SECRET_KEY: medsiem_selenium_testing_secret_key_ci_32bytes!
          MINIO_SECRET_KEY: medsiem_minio_secure_secret_key_2026
          PYTHONPATH: .
        run: |
          cd backend
          alembic upgrade head
          python3 -m app.db.seed

      - name: Start FastAPI Backend Service
        env:
          POSTGRES_SERVER: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: medsiem_user
          POSTGRES_PASSWORD: medsiem_secure_password_2026
          POSTGRES_DB: medsiem_db
          SECRET_KEY: medsiem_selenium_testing_secret_key_ci_32bytes!
          MINIO_SECRET_KEY: medsiem_minio_secure_secret_key_2026
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          ENVIRONMENT: test
          PYTHONPATH: .
        run: |
          cd backend
          nohup uvicorn app.main:app --host 0.0.0.0 --port 8000 > /tmp/uvicorn.log 2>&1 &
          echo "Waiting for FastAPI backend..."
          for i in {1..30}; do
            if curl -s http://localhost:8000/health | grep -q "status"; then
              echo "FastAPI backend is ready!"
              break
            fi
            sleep 1
          done

      # ── ACTION 3: actions/setup-node@v4 ────────────────────────────────────
      - name: "Action: Setup Node.js 20"
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Build and Start Next.js Frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
        run: |
          cd frontend
          npm ci
          npm run build
          nohup npm start -- -p 3000 > /tmp/nextjs.log 2>&1 &
          echo "Waiting for Next.js frontend on port 3000..."
          for i in {1..30}; do
            if curl -s -I http://localhost:3000/login | grep -q "200\|307\|308"; then
              echo "Next.js frontend is ready!"
              break
            fi
            sleep 1
          done

      - name: Install Selenium Test Dependencies
        run: |
          cd tests/e2e
          npm install

      - name: Execute Selenium Browser Automation Suite
        env:
          FRONTEND_URL: http://localhost:3000
          BACKEND_URL: http://localhost:8000
        run: |
          mkdir -p test-results/selenium/screenshots
          node tests/e2e/selenium_test.js 2>&1 | tee test-results/selenium/execution.log

      # ── GENERATE EXCEL REPORT ──────────────────────────────────────────────
      - name: Generate Selenium Excel Test Report
        if: always()
        run: |
          python3 scripts/generate_excel_reports.py

      # ── ACTION 4: actions/upload-artifact@v4 ───────────────────────────────
      - name: "Action: Upload Selenium Test Artifacts & Excel Report"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: medsiem-selenium-test-results
          path: |
            test-results/selenium/
            test-results/Excel/
          retention-days: 30

      - name: Append Selenium Summary to Job Summary
        if: always()
        run: |
          echo "## 🌐 Selenium Web Testing Results" >> $GITHUB_STEP_SUMMARY
          if [ -f test-results/selenium/summary.md ]; then
            cat test-results/selenium/summary.md >> $GITHUB_STEP_SUMMARY
          else
            echo "Results available in artifacts: medsiem-selenium-test-results" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📊 Excel Report" >> $GITHUB_STEP_SUMMARY
          echo "Download the Excel test report from the **medsiem-selenium-test-results** artifact." >> $GITHUB_STEP_SUMMARY
