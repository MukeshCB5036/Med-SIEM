name: Deploy Reports to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  deploy-pages:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build Reports
        run: |
          python3 build_reports.py

      - name: Deploy Latest Report
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./reports/latest
          destination_dir: latest

      - name: Archive Build History Report
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./reports/latest
          destination_dir: history/build-${{ github.run_number }}
