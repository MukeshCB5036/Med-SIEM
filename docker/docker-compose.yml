services:
  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: medsiem-backend
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    environment:
      - POSTGRES_SERVER=postgres
      - REDIS_HOST=redis
      - OPENSEARCH_HOST=opensearch
      - MINIO_ENDPOINT=minio:9000
    volumes:
      - ../backend:/app
    depends_on:
      - postgres
      - redis
      - opensearch
      - minio

  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    container_name: medsiem-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    depends_on:
      - backend

  postgres:
    image: postgres:16-alpine
    container_name: medsiem-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-medsiem_db}
      POSTGRES_USER: ${POSTGRES_USER:-medsiem_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medsiem_user} -d ${POSTGRES_DB:-medsiem_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: medsiem-redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  opensearch:
    image: opensearchproject/opensearch:2.13.0
    container_name: medsiem-opensearch
    environment:
      - cluster.name=medsiem-cluster
      - node.name=medsiem-node1
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - DISABLE_INSTALL_DEMO_CONFIGS=true
      - DISABLE_SECURITY_PLUGIN=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "9200:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data

  minio:
    image: minio/minio:RELEASE.2024-05-28T17-19-04Z
    container_name: medsiem-minio
    restart: always
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-medsiem_minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

volumes:
  pgdata:
  opensearch-data:
  minio-data:
